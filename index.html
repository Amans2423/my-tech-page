<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 IT Skills Practice Hub</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#315efb;--primary2:#6c63ff;--border:#e4e7ec;--good:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef3ff,#f8fafc);color:var(--text)}
header{padding:28px 18px;text-align:center;background:linear-gradient(135deg,#315efb,#6c63ff);color:white}
header h1{margin:0 0 8px;font-size:32px} header p{margin:0;opacity:.9}
.container{max-width:1100px;margin:30px auto;padding:0 18px}
.screen{display:none}.screen.active{display:block}
.home-grid,.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(16,24,40,.07)}
.unit-btn,.choice-btn,.back-btn,.next-btn{border:0;border-radius:14px;padding:17px 18px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.unit-btn{background:white;color:var(--text);border:1px solid var(--border);min-height:125px;text-align:left}
.unit-btn:hover,.choice-btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(49,94,251,.15)}
.unit-no{display:block;color:var(--primary);font-size:13px;margin-bottom:8px;text-transform:uppercase}
.choice-btn{background:linear-gradient(135deg,#315efb,#6c63ff);color:white;min-height:130px}
.choice-btn small{display:block;font-weight:400;margin-top:8px;opacity:.9}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{background:#fff;border:1px solid var(--border);color:var(--text);padding:10px 15px}
h2{margin:0}.muted{color:var(--muted)}
.progress{height:9px;background:#e9edf5;border-radius:20px;overflow:hidden;margin:15px 0 22px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#315efb,#6c63ff);width:0}
.question-card{background:white;border:1px solid var(--border);border-radius:18px;padding:24px}
.qno{color:var(--primary);font-weight:700}.question{font-size:20px;font-weight:700;line-height:1.45;margin:10px 0 20px}
.options{display:grid;gap:11px}.option{padding:14px 16px;border:1px solid var(--border);background:#fff;border-radius:12px;text-align:left;cursor:pointer;font-size:16px}
.option:hover{border-color:#9db0ff;background:#f7f8ff}.option.correct{background:#ecfdf3;border-color:#86efac;color:#166534}.option.wrong{background:#fef2f2;border-color:#fca5a5;color:#991b1b}.option.disabled{cursor:default}
.feedback{margin-top:16px;padding:12px;border-radius:10px;font-weight:600;display:none}.feedback.show{display:block}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.next-btn{background:var(--primary);color:white;padding:12px 20px}.next-btn:disabled{opacity:.45;cursor:not-allowed}
.score{text-align:center;background:white;border:1px solid var(--border);border-radius:18px;padding:28px;margin-top:20px}
.score strong{font-size:38px;color:var(--primary)}
.descriptive-list{display:grid;gap:14px}
.desc{background:white;border:1px solid var(--border);border-radius:15px;padding:18px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef2ff;color:#315efb;font-size:12px;font-weight:700;margin-bottom:8px}
footer{text-align:center;color:var(--muted);padding:30px}
@media(max-width:600px){header h1{font-size:25px}.question{font-size:18px}.container{margin-top:18px}}
</style>
</head>
<body>
<header>
<h1>Class 10 IT Skills Practice Hub</h1>
<p>MCQ & Descriptive Practice • Four Units</p>
</header>

<div class="container">

<section id="home" class="screen active">
<div class="card" style="margin-bottom:20px;text-align:center">
<h2>Select a Unit</h2><p class="muted">Choose a unit to access MCQ and descriptive practice.</p>
</div>
<div class="home-grid">
<button class="unit-btn" onclick="openUnit(0)"><span class="unit-no">Unit 1</span><strong>Communication Skills</strong><br><span class="muted">MCQs + Descriptive Practice</span></button>
<button class="unit-btn" onclick="openUnit(1)"><span class="unit-no">Unit 2</span><strong>ICT Skills</strong><br><span class="muted">MCQs + Descriptive Practice</span></button>
<button class="unit-btn" onclick="openUnit(2)"><span class="unit-no">Unit 3</span><strong>Self-Management</strong><br><span class="muted">MCQs + Descriptive Practice</span></button>
<button class="unit-btn" onclick="openUnit(3)"><span class="unit-no">Unit 4</span><strong>Digital Documentation</strong><br><span class="muted">MCQs + Descriptive Practice</span></button>
</div>
</section>

<section id="choice" class="screen">
<div class="topbar"><button class="back-btn" onclick="goHome()">← Home</button><div><h2 id="unitTitle"></h2><span class="muted">Choose practice type</span></div><span></span></div>
<div class="choice-grid">
<button class="choice-btn" onclick="startMCQ()">MCQ Practice<small>Attempt all questions with instant feedback and score.</small></button>
<button class="choice-btn" onclick="showDescriptive()">Descriptive Practice<small>Practice 2-mark and 3-mark questions.</small></button>
</div>
</section>

<section id="mcq" class="screen">
<div class="topbar"><button class="back-btn" onclick="backToChoice()">← Unit Menu</button><div><h2 id="mcqTitle"></h2><span id="counter" class="muted"></span></div><span></span></div>
<div class="progress"><span id="progressBar"></span></div>
<div id="questionArea"></div>
</section>

<section id="descriptive" class="screen">
<div class="topbar"><button class="back-btn" onclick="backToChoice()">← Unit Menu</button><div><h2 id="descTitle"></h2><span class="muted">Descriptive Practice</span></div><span></span></div>
<div class="descriptive-list" id="descList"></div>
</section>

</div>
<footer>Class 10 • Practice Website</footer>

<script>

mcqs:[
["What does self-management refer to?",["Managing others","Managing oneself effectively","Managing only time","Managing money"],1],

["LibreOffice is a:",["Web browser","Free and open-source office suite","Programming language","Database only"],1],

let currentUnit=0,currentQ=0,score=0,answered=false;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function openUnit(i){currentUnit=i;document.getElementById('unitTitle').textContent=units[i].title;show('choice')}
function goHome(){show('home')}
function backToChoice(){show('choice')}
function startMCQ(){currentQ=0;score=0;document.getElementById('mcqTitle').textContent=units[currentUnit].title+" — MCQ Practice";show('mcq');renderQuestion()}
function renderQuestion(){
 const u=units[currentUnit], q=u.mcqs[currentQ]; answered=false;
 document.getElementById('counter').textContent=`Question ${currentQ+1} of ${u.mcqs.length}`;
 document.getElementById('progressBar').style.width=((currentQ+1)/u.mcqs.length*100)+'%';
 document.getElementById('questionArea').innerHTML=`
 <div class="question-card">
 <div class="qno">Question ${currentQ+1}</div>
 <div class="question">${q[0]}</div>
 <div class="options">${q[1].map((x,i)=>`<button class="option" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div>
 <div id="feedback" class="feedback"></div>
 <div class="nav"><span class="muted">${score} correct so far</span><button id="nextBtn" class="next-btn" onclick="nextQuestion()" disabled>${currentQ===u.mcqs.length-1?'Finish':'Next →'}</button></div>
 </div>`;
}
function answer(i){
 if(answered)return; answered=true;
 const q=units[currentUnit].mcqs[currentQ], buttons=document.querySelectorAll('.option'),fb=document.getElementById('feedback');
 buttons.forEach(b=>b.classList.add('disabled'));
 buttons[q[2]].classList.add('correct');
 if(i===q[2]){score++;fb.textContent="✓ Correct!";fb.style.color="#166534";fb.style.background="#ecfdf3"}
 else{buttons[i].classList.add('wrong');fb.textContent="✗ Incorrect. The correct answer is "+String.fromCharCode(65+q[2])+". "+q[1][q[2]];fb.style.color="#991b1b";fb.style.background="#fef2f2"}
 fb.classList.add('show');document.getElementById('nextBtn').disabled=false;
}
function nextQuestion(){
 const u=units[currentUnit];
 if(currentQ<u.mcqs.length-1){currentQ++;renderQuestion()}else{
 document.getElementById('questionArea').innerHTML=`<div class="score"><p>MCQ Practice Completed</p>
<div style="margin:12px 0;padding:10px 14px;border-radius:10px;background:#f3f4f6;font-size:14px;">
  <strong>MCQ Mode:</strong> Click an option to check your answer. The next question will open automatically.
</div>
<strong>${score} / ${u.mcqs.length}</strong><p class="muted">${Math.round(score/u.mcqs.length*100)}% Score</p><button class="next-btn" onclick="startMCQ()">↻ Try Again</button> <button class="back-btn" onclick="backToChoice()">Unit Menu</button></div>`;
 }
}
function showDescriptive(){
 const u=units[currentUnit];document.getElementById('descTitle').textContent=u.title;
 let n=0,html='<div class="card" style="margin-bottom:16px"><strong>2 Marks Questions</strong><p class="muted">Answer briefly and clearly.</p></div>';
 html+=u.desc2.map(q=>`<div class="desc"><span class="badge">2 Marks</span><div>${++n}. ${q}</div></div>`).join('');
 html+='<div class="card" style="margin:24px 0 16px"><strong>3 Marks Questions</strong><p class="muted">Write complete answers with relevant points/examples.</p></div>';
 html+=u.desc3.map(q=>`<div class="desc"><span class="badge">3 Marks</span><div>${++n}. ${q}</div></div>`).join('');
 document.getElementById('descList').innerHTML=html;show('descriptive')
}
</script>

<script>
(function () {
  function initAutoAdvance() {
    const root = document.body;
    if (root.dataset.autoAdvanceReady) return;
    root.dataset.autoAdvanceReady = "1";

    // Find likely MCQ answer controls without depending on the original
    // implementation's exact variable/function names.
    root.addEventListener("click", function (e) {
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;

      // Ignore navigation/home/unit/descriptive controls.
      const isAnswer =
        target.matches('input[type="radio"], input[type="checkbox"]') ||
        target.closest('[data-answer], .option, .answer-option, .mcq-option, .option-btn');

      if (!isAnswer) return;

      const option = target.closest('label, button, .option, .answer-option, .mcq-option, .option-btn') || target;

      // Give the original quiz handler time to mark the answer and display feedback.
      setTimeout(function () {
        // Try common "next question" controls first.
        const next = Array.from(root.querySelectorAll("button, a")).find(el => {
          const t = (el.textContent || "").trim().toLowerCase();
          return /^(next|next question|continue)$/.test(t) &&
                 el.offsetParent !== null &&
                 getComputedStyle(el).display !== "none";
        });

        if (next) {
          next.click();
          return;
        }

        // Fallback: activate the next visible question panel.
        const questions = Array.from(root.querySelectorAll(
          '[data-question], .question, .mcq-question, .quiz-question'
        )).filter(el => el.offsetParent !== null);

        if (questions.length > 1) {
          const current = questions.findIndex(q => q.contains(option));
          if (current >= 0 && current < questions.length - 1) {
            questions[current].style.display = "none";
            questions[current + 1].style.display = "";
            questions[current + 1].scrollIntoView({behavior:"smooth", block:"center"});
          }
        }
      }, 450);
    }, true);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initAutoAdvance, {once:true});
  } else {
    initAutoAdvance();
  }
})();
</script>

</body>
</html>
